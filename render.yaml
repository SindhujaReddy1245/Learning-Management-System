services:
  # Python FastAPI Backend
  - type: web
    name: lms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    buildFilter:
      paths:
        - "backend/**"
    envVars:
      - key: DATABASE_URL
        sync: false # You can enter your database connection URL in Render's dashboard
      - key: FRONTEND_URL
        sync: false # Example: https://your-frontend.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false # Optional comma-separated list of frontend origins

  # Vite React Frontend (Static Site)
  - type: web
    name: lms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - "frontend/**"
